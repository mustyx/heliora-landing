name: Deploy to Namecheap

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      # Switched from rsync-over-SSH to plain SFTP. Namecheap's cPanel shell
      # (jailshell/CageFS) prints a banner on login that corrupts rsync's
      # binary handshake ("protocol version mismatch -- is your shell clean?").
      # SFTP talks to a dedicated subsystem instead of the login shell, so it
      # isn't affected by that banner. Same secrets as before, no new setup.
      - name: Deploy via SFTP to Namecheap
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SSH_HOST }}
          protocol: sftp
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USERNAME }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          local-dir: ./
          server-dir: /helioraconsulting.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/*.md
            **/.env
            **/heliora_deploy_key*
            **/config/config.php
            **/.claude/**
            **/.impeccable/**
            **/designs/**
            **/*.bat
            **/*.sql
            **/*.jpeg
            **/index-prerebrand-backup.html
